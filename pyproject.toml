[project]
name = "bluecode"
version = "0.1.0"
description = "Terminal Bluetooth messenger over RFCOMM (BlueZ)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0"]

[project.urls]
Repository = "https://github.com/JustAWall/BlueCode"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes>=3"]

[project.scripts]
bluecode = "bluecode.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bluecode"]
